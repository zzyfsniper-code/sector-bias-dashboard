name: Earnings gap daily data
on:
  workflow_dispatch:
  schedule:
    - cron: '25 0 * * 1-5'
    - cron: '15 7 * * 1-5'
permissions:
  contents: write
  pages: write
concurrency:
  group: earnings-gap-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pdfplumber==0.11.9
      - name: Refresh financial candidates and paper trades
        id: refresh
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python strategies/earnings_gap/update_data.py
      - name: Verify trading rules
        id: verify
        run: |
          python strategies/earnings_gap/test_strategy.py
          python strategies/earnings_gap/test_update_data.py
          python strategies/earnings_gap/test_financial_sources.py
          python strategies/earnings_gap/test_monitoring.py
          python strategies/earnings_gap/test_profit_reasons.py
          python strategies/earnings_gap/test_volume.py
          node strategies/earnings_gap/test_volume.js
          node strategies/earnings_gap/test_signal.js
          node strategies/earnings_gap/test_monitor.js
          python strategies/earnings_gap/test_display_context.py
      - name: Record rule verification failure
        if: failure() && steps.verify.outcome == 'failure'
        run: python strategies/earnings_gap/monitoring.py --fail "规则或监控校验失败，新交易数据未发布"
      - name: Refresh display-only PB and industry statistics
        continue-on-error: true
        timeout-minutes: 8
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python strategies/earnings_gap/display_context.py
      - name: Publish successful data snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python strategies/earnings_gap/publish.py --data-only
      - name: Publish failed update status while preserving trading data
        if: failure() && (steps.refresh.outcome == 'failure' || steps.verify.outcome == 'failure')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python strategies/earnings_gap/publish.py --monitor-only
