<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src https://tuoshui-portfolio-view.pages.dev; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><link rel="preconnect" href="https://tuoshui-portfolio-view.pages.dev" crossorigin><link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css"><script src="./app.js?v=9c61c5a4bada" defer></script><title>脱水组合 · 盘中监控</title></head><body>
<main><form id="login" hidden><h1>脱水组合</h1><p>输入访问密码，查看持仓与预计调仓。</p><label>访问密码<input type="password" id="pass" autocomplete="current-password" required></label><button>进入看板</button><p id="loginStatus" role="status"></p></form>
<div id="board" hidden><header><h1>脱水组合</h1><button id="logout">退出</button></header><section class="hero"><div><span>最近确认收盘</span><h2 id="asof"></h2></div><div><span>组合净值</span><strong id="nav"></strong></div><div><span>阶段</span><strong id="stage"></strong></div><div><span>实际仓位</span><strong id="weight"></strong></div></section>

<section><div class="row"><h2>盘中预计调仓</h2><button id="refresh">刷新</button></div><p id="status" role="status"></p><p id="time"></p><div id="changes"></div><details><summary>今日估算记录</summary><div id="ticks"></div></details></section>
<section><h2>已确认持仓</h2><div id="holdings"></div></section><section><h2>组合净值</h2><svg id="chart" viewBox="0 0 800 170" aria-label="历史组合净值" role="img"></svg><small id="range"></small></section><section><h2>最近10个交易日的正式调仓</h2><div id="orders"></div></section>

<footer>北京时间。盘中预计由本机计算，14:40至14:58每两分钟更新一次。本机离线时可查看最近一次上传的数据。正式调仓以收盘后的记录为准。</footer></div><p id="error" role="alert"></p><button id="loadRetry" type="button" hidden>重新读取持仓</button></main></body></html>
